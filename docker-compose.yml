version: "3.8"

services:
  app:
    build: .
    container_name: competitive-analysis
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    volumes:
      - ./outputs:/app/outputs
      - ./traces:/app/traces
      - ./artifacts:/app/artifacts
      - ./config:/app/config:ro
    restart: unless-stopped
