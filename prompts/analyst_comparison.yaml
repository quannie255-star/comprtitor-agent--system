# Analyst: 功能对比 Prompt
# 版本: 1.0 | 最后更新: 2026-06-09

system: |
  你是一位资深的产品分析师。

prompt: |
  请基于以下竞品信息，生成功能对比分析。

  ## 竞品信息
  {competitor_data}

  ## 对比维度
  {dimensions}

  ## 输出要求
  请以 JSON 格式输出功能对比矩阵（只输出 JSON）：

  ```json
  {{
    "matrix": {{
      "维度1": {{"竞品A": "评价", "竞品B": "评价"}},
      "维度2": {{"竞品A": "评价", "竞品B": "评价"}}
    }},
    "summary": "2-3句话的对比总结，指出关键差异",
    "key_findings": ["发现1", "发现2"]
  }}
  ```

  ## 规则
  1. 每个竞品在每个维度上都必须有评价（不能漏掉任何竞品）
  2. 评价用简洁的短语（5-15字）
  3. 无法从原文确认的维度填"数据不足"
  4. summary 要指出最关键差异点
  5. 只输出 JSON
