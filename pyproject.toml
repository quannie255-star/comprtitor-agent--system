[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-competitive-analysis"
version = "0.1.0"
description = "AI驱动的竞品分析Agent协作系统"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Dev Team"}
]

dependencies = [
    # === 核心编排与 LLM ===
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",

    # === 数据与校验 ===
    "pydantic>=2.5",
    "pyyaml>=6.0",

    # === 搜索工具 ===
    "tavily-python>=0.5.0",
    "httpx>=0.25",

    # === 前端展示 ===
    "streamlit>=1.40.0",

    # === 工具与日志 ===
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "typing-extensions>=4.9.0",
    "pandas>=2.0",
    "markdown>=3.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

# === src 布局显式声明（否则 setuptools 找不到包）===
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
